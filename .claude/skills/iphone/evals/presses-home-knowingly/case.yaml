schema_version: "1.1"
name: presses-home-knowingly
context:
  scaffold_script: start-phone.sh
expected_outcome: |
  The Home button is pressed (the person asked for it) and a picture of the Home screen of iOS is taken after
  it: the picture shows the Home screen, not LiteBro. The answer describes that screen and says that LiteBro is
  now off the screen, so files, taps and typing do not answer until the person opens LiteBro again.
