# The iOS app (ios/): built on a Mac runner without signing, fake-signed with ldid and packed as
# LiteBro.tipa for TrollStore. A pull request gets it as a download of the run;
# every push to main replaces the file of the prerelease "ios" («LiteBro для iOS»): LiteBro-iOS.zip
# with the .tipa inside (public files only in zip, user's rule 2026-11-25).
name: iOS

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install xcodegen ldid

      - name: Project
        working-directory: ios
        run: |
          # The commit in the debug log and the settings
          echo "${GITHUB_SHA::7}" > LiteBro/Resources/build.txt
          xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project LiteBro.xcodeproj -scheme LiteBro -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation -skipMacroValidation \
            build | tee build.log | grep -E '(error|warning: unre|BUILD)' || true
          test -d build/Build/Products/Release-iphoneos/LiteBro.app || { tail -100 build.log; exit 1; }

      - name: Pack .tipa
        working-directory: ios
        run: |
          # Two builds from one: LiteBro.tipa with the whole phone for the PC (no-sandbox: TrollStore
          # registers it as System) and LiteBro-Browser.tipa without it (User: can be the default browser)
          pack() {
            rm -rf Payload && mkdir Payload
            cp -R build/Build/Products/Release-iphoneos/LiteBro.app Payload/
            ldid -SScreen.entitlements Payload/LiteBro.app/PlugIns/LiteBroScreen.appex/LiteBroScreen
            ldid -S"$1" Payload/LiteBro.app/LiteBro
            rm -f "$2" && zip -qry "$2" Payload
          }
          pack TrollStore.entitlements LiteBro.tipa
          pack Browser.entitlements LiteBro-Browser.tipa
          # The debug build, until the release: its own app beside LiteBro (own id and data, empty at the
          # start), only the application id, without the screen extension. It launches and LiteBro does
          # not: the rights or the data of LiteBro; neither launches: the code (its log in Files tells where).
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LiteBro.app Payload/
          rm -rf Payload/LiteBro.app/PlugIns
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier io.github.ronanime-arch.LiteBro.debug" \
            -c "Set :CFBundleDisplayName LiteBro Debug" Payload/LiteBro.app/Info.plist
          ldid -SDebug.entitlements Payload/LiteBro.app/LiteBro
          rm -f LiteBro-Debug.tipa && zip -qry LiteBro-Debug.tipa Payload
          rm -f LiteBro-iOS.zip && zip -q LiteBro-iOS.zip LiteBro.tipa LiteBro-Browser.tipa LiteBro-Debug.tipa
          ls -l LiteBro.tipa LiteBro-Browser.tipa LiteBro-Debug.tipa LiteBro-iOS.zip

      - name: File of the run
        uses: actions/upload-artifact@v4
        with:
          name: LiteBro-iOS
          path: |
            ios/LiteBro.tipa
            ios/LiteBro-Browser.tipa
            ios/LiteBro-Debug.tipa
          retention-days: 14

      - name: Prerelease
        if: github.event_name != 'pull_request'
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="LiteBro-iOS.zip для TrollStore на iOS 16: LiteBro.tipa — ПК видит весь телефон; LiteBro-Browser.tipa — можно сделать браузером по умолчанию, ПК видит только папку LiteBro; LiteBro-Debug.tipa — отдельное приложение для поиска причины, если LiteBro не запускается. Заменяется после каждого изменения папки ios/ в main."
          if gh release view ios > /dev/null 2>&1; then
            gh release upload ios LiteBro-iOS.zip --clobber
            gh release edit ios --notes "$notes"
            # Earlier builds put the bare .tipa there
            gh release delete-asset ios LiteBro.tipa --yes 2> /dev/null || true
          else
            gh release create ios LiteBro-iOS.zip --target "$GITHUB_SHA" --prerelease \
              --title "LiteBro для iOS (TrollStore)" --notes "$notes"
          fi
