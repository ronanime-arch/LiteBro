# The installer built on Windows by build.ps1. A pull request gets it as a download of the run (to try before the merge);
# every push to main publishes it as a release «LiteBro 1.9.x» (the version build.ps1 gives the file), with the merged PRs.
name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.ps1 counts the commits on main for the version

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Installer of the pull request
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: LiteBro-Setup
          path: dist/LiteBro-Setup.exe
          retention-days: 14

      - name: Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Item dist/LiteBro-Setup.exe).VersionInfo.FileVersion
          $tag = "v$version"
          # Run again for the same commit: the file is replaced
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/LiteBro-Setup.exe --clobber
          } else {
            gh release create $tag dist/LiteBro-Setup.exe --target $env:GITHUB_SHA --title "LiteBro $version" --generate-notes
          }
          if ($LASTEXITCODE) { exit 1 }
