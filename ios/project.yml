# XcodeGen spec: `xcodegen generate` makes LiteBro.xcodeproj (not committed).
name: LiteBro
options:
  bundleIdPrefix: io.github.ronanime-arch
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.9.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # SSH for the terminal to the computer (Apache 2.0) and the terminal view (MIT)
  SwiftNIO:
    url: https://github.com/apple/swift-nio
    from: 2.81.0
  SwiftNIOSSH:
    url: https://github.com/apple/swift-nio-ssh
    exactVersion: 0.15.2
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
targets:
  LiteBro:
    type: application
    platform: iOS
    sources:
      - path: LiteBro
      - path: Shared
    dependencies:
      - target: LiteBroScreen
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftNIO
        product: NIOHTTP1
      - package: SwiftNIOSSH
        product: NIOSSH
      - package: SwiftTerm
    info:
      path: LiteBro/Info.plist
      properties:
        CFBundleDisplayName: LiteBro
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: LiteBro opens sites on your local network.
        NSPhotoLibraryAddUsageDescription: LiteBro saves downloaded videos to Photos.
        UIBackgroundModes: [audio]
        NSFaceIDUsageDescription: LiteBro asks for Face ID before filling in passwords and cards.
        # Links from other apps (LiteBro as the default browser)
        CFBundleURLTypes:
          - CFBundleURLName: Web
            CFBundleURLSchemes: [http, https]
          # The QR code of the terminal in LiteBro on Windows: litebro://ssh?host=…
          - CFBundleURLName: LiteBro
            CFBundleURLSchemes: [litebro]
        LSApplicationQueriesSchemes: [googlechrome, googlechromes]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ronanime-arch.LiteBro
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  # The screen for the computer: the broadcast extension of the screen recording (ReplayKit)
  LiteBroScreen:
    type: app-extension
    platform: iOS
    sources:
      - path: Screen
      - path: Shared
    dependencies:
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftNIO
        product: NIOHTTP1
    info:
      path: Screen/Info.plist
      properties:
        CFBundleDisplayName: LiteBro
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ronanime-arch.LiteBro.Screen
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
