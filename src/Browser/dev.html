<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Для разработчика</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f2f3f6; --fg: #1b1d22; --muted: #6b7080; --card: #ffffff; --line: rgba(0, 0, 0, .12);
  --accent: #1f9d55; --text: "Segoe UI Variable Text", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121212; --fg: #e9eaee; --muted: #9a9fae; --card: #1c1d20; --line: rgba(255, 255, 255, .14); }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--text); }
main { max-width: 820px; margin: 0 auto; padding: 22px 22px 40px; }
h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
h2 { margin: 26px 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.muted { color: var(--muted); font-size: 12.5px; margin: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 12px; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; }
label.item { display: flex; align-items: center; gap: 14px; padding: 10px 14px; cursor: pointer; user-select: none; }
label.item + label.item { border-top: 1px solid var(--line); }
label.item:hover { background: rgba(127, 127, 127, .06); }
.item .text { flex: 1; min-width: 0; }
.item .name { font-weight: 600; }
.item.off .name { color: var(--muted); }
.item input { position: absolute; opacity: 0; pointer-events: none; }
.track { width: 38px; height: 22px; border-radius: 11px; background: rgba(127, 127, 127, .45); position: relative; transition: background .15s; flex: none; }
.track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.item input:checked + .track { background: var(--accent); }
.item input:checked + .track::after { left: 19px; }
.item input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: 13px var(--text); padding: 4px 12px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
button:hover { background: rgba(127, 127, 127, .15); }
button:disabled { opacity: .45; cursor: default; background: transparent; }
</style>
</head>
<body>
<main>
  <h1>Для разработчика</h1>
  <p class="muted">Выключенное пропадает из интерфейса во всех окнах сразу и остаётся выключенным после перезапуска (строка DevOff в settings.ini).
    Эту страницу выключить нельзя: она всегда открывается кнопкой у правого края стартовой страницы и кнопкой на странице журнала сети.</p>
  <div class="row">
    <button id="allOn" disabled>Включить всё</button>
    <span class="muted" id="count"></span>
  </div>
  <div id="groups"></div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const post = m => window.chrome.webview.postMessage(m);

// Ids as in Dev.Ids (Dev.cs): the browser takes no other
const GROUPS = [
  ["Панель инструментов", "Пропадает только кнопка: её горячие клавиши работают.", [
    ["back", "Назад", "Alt+← работает."],
    ["forward", "Вперёд", "Alt+→ работает."],
    ["reload", "Обновить", "F5 и Ctrl+R работают."],
    ["home", "Проекты (домик)", "Alt+Home и новая вкладка (Ctrl+T) открывают плитки."],
    ["star", "Избранное (звёздочка)", "Плитки и ссылки проекта по-прежнему добавляются на стартовой странице."],
    ["ram", "Память браузера справа", "Диспетчер процессов открывается по Shift+Esc."],
  ]],
  ["Инструменты", "Пропадают вместе с пунктами меню и горячими клавишами. Когда выключены эмуляция, снимок и хранилище, пропадает и кнопка «Инструменты» (гаечный ключ).", [
    ["reset", "Сброс сайта", "Кнопка с ластиком. Ctrl+Shift+R и Ctrl+F5 тогда делают обычную перезагрузку без кэша, как в других браузерах."],
    ["country", "Страна поиска Google", "Кнопка на странице поиска и параметры gl/hl. Выбранная страна запомнится и вернётся при включении."],
    ["emulation", "Эмуляция устройства и сети", "Выключение снимает эмуляцию во всех вкладках (страница с эмуляцией экрана перезагрузится)."],
    ["snapshot", "Снимок страницы", "Пункты меню «Инструменты» и Ctrl+Shift+S."],
    ["storage", "Хранилище сайта", "Пункт меню «Инструменты». Уже открытая вкладка хранилища продолжит работать."],
    ["json", "Просмотр JSON деревом", "Ответы API в формате JSON показываются простым текстом."],
    ["mocks", "Заглушки", "Запросы снова идут на сервер, раздел на странице журнала сети скрыт. Сами заглушки сохраняются."],
    ["split", "Две вкладки рядом", "Пункт «Открыть рядом» в меню вкладки. Уже открытое разделение убирается как обычно."],
  ]],
  ["Стартовая страница", "Пропадает только кнопка; кнопку «Для разработчика» выключить нельзя.", [
    ["shell", "Терминал (фиолетовая кнопка слева)", "Терминал в папке проекта открывается из консоли проекта."],
    ["localonly", "Переключатель «только localhost»", "Режим остаётся как был; переключается на странице журнала сети."],
    ["netlog", "Журнал сети", "Журнал открывается и кнопкой ниже."],
    ["console", "Консоль проекта (>_ на плитках)", "Консоль открывается и со страниц запуска и ошибки проекта."],
  ]],
];

const boxes = {};
for (const [title, note, items] of GROUPS) {
  const h = document.createElement("h2");
  h.textContent = title;
  const p = document.createElement("p");
  p.className = "muted";
  p.textContent = note;
  const section = document.createElement("section");
  for (const [id, name, what] of items) {
    const label = document.createElement("label");
    label.className = "item";
    const text = document.createElement("span");
    text.className = "text";
    const n = document.createElement("div");
    n.className = "name";
    n.textContent = name;
    const w = document.createElement("div");
    w.className = "muted";
    w.textContent = what;
    text.append(n, w);
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = true;
    box.addEventListener("change", () => {
      label.classList.toggle("off", !box.checked);
      post({ type: "dev", id, on: box.checked });
    });
    const track = document.createElement("span");
    track.className = "track";
    label.append(text, box, track);
    section.append(label);
    boxes[id] = box;
  }
  $("groups").append(h, p, section);
}
{
  const row = document.createElement("div");
  row.className = "row";
  const log = document.createElement("button");
  log.textContent = "Открыть журнал сети";
  log.addEventListener("click", () => post({ type: "netOpen" }));
  row.append(log);
  $("groups").append(row);
}

$("allOn").addEventListener("click", () => post({ type: "devReset" }));

window.chrome.webview.addEventListener("message", e => {
  const m = e.data;
  if (!m || m.type !== "net") return;
  const off = m.off || [];
  for (const id in boxes) {
    boxes[id].checked = !off.includes(id);
    boxes[id].closest("label").classList.toggle("off", off.includes(id));
  }
  $("allOn").disabled = off.length === 0;
  $("count").textContent = off.length ? "Выключено: " + off.length : "Всё включено";
});

post({ type: "ready" });
</script>
</body>
</html>
